<form class="todo-form" (ngSubmit)="submit()">
  <div class="field title-field">
    <label for="todo-title">Tarefa</label>
    <input
      id="todo-title"
      name="title"
      type="text"
      placeholder="Digite uma tarefa"
      autocomplete="off"
      required
      [(ngModel)]="title"
    />
  </div>

  <div class="field">
    <label for="todo-date">Data</label>
    <input
      id="todo-date"
      name="date"
      type="date"
      required
      [(ngModel)]="date"
    />
  </div>

  <div class="field">
    <label for="todo-priority">Prioridade</label>
    <select
      id="todo-priority"
      name="priority"
      [(ngModel)]="priority"
    >
      <option value="baixa">Baixa</option>
      <option value="media">Média</option>
      <option value="alta">Alta</option>
    </select>
  </div>

  <button
    class="add-button"
    type="submit"
    [disabled]="title.trim().length === 0 || !date"
  >
    Adicionar
  </button>
</form>
